<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB PORTAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Montserrat:wght@100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
*{
    margin: 0px;
    padding: 0px;
    box-sizing: border-box;
    font-family: 'poppins',sans-serif;

}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: url("https://media.istockphoto.com/id/2154887234/photo/futuristic-digital-network-background-people-and-cloud-computing-with-connections-technology.jpg?s=1024x1024&w=is&k=20&c=9j5pWs0osSDjrjXrCWvMRbzpZrBAykK5IOj1F9dnNQs=");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
}
header{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 100px;
    
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 99;
}
.logo{
    font-size: 2em;
    color: #fff;
    user-select: none;
}
.navigation a{
    position: relative;
    font-size: 1.1em;
    color: pink;
    text-decoration: none;
    font-weight: 500;
    margin-left: 40px;
}
.navigation a::after{
    content: '';
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 100%;
    height: 3px;
    background: white;
    border-radius: 5px;
    transform-origin: right;
    transform: scaleX(0);
    transition: transform .5s;

}

.navigation a:hover::after{
    transform: scaleX(1);

}
.navigation .btnlogin-popup{
    width: 130px;
    height: 50px;
    background: transparent;
    border: 2px solid skyblue;
    outline: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1.1em;
    color: aquamarine;
    font-weight: 500;
    margin-left: 40px;
    transition: .5s;
}
.navigation .btnlogin-popup:hover{
    background: yellow;
    color: blueviolet;
}
.wrapper{
    position: relative;
    width: 400px;
    height: 440px;
    background: transparent;
    border: 2px solid rgba(211, 27, 27, 0.5);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 30px rgba(236, 51, 223, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    
    transition: height .2s ease;
}
.wrapper.active{
    height: 520px;
}
.wrapper .form-box{
    width: 100%;
    padding: 40px;}
.wrapper .form-box.login{
   /* display: none;*/

    }
    .wrapper.active .form-box.login{
        transition: none;
        transform: translateX(-400px);
    }
    .wrapper .form-box .register{
    position: absolute;
    transform:translateX(400px);
}

.wrapper .icon-close{
    position: absolute;
    top: 0;
    right: 0;
    width: 45px;
    height: 45px;
    background:black;
    font-size: 2em;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom-left-radius: 20px;
    cursor: pointer;
    z-index: 1;

    }
.form-box h2{
    font-size: 2em;
    color: aliceblue;
    text-align: center;
}.input-box{
    position: relative;
    width: 100%;
    height: 50px;
    border-bottom: 2px solid red;
    margin: 30px 0;


}
.input-box label{
    position: absolute;
    top: 50%;
    left: 5px;
    transform: translateY(-50%);
    color: #fff;
    font-size: 1em;
    font-weight: 500;
    pointer-events: none;
    transition: .5s;


}
.input-box input:focus~label,
.input-box input:valid~label{
    top: -5px;
}
.input-box input{
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-size: 1em;

    color: white;
    font-weight: 600;
    padding: 0 35px 0 5px;
}
.input-box .icon{
    
    position: absolute;
    right: 8px;
    font-size: 1.2em;
    color: blue;
    line-height: 57px;


}
.remember-forgot{
    font-size: .9em;
    color: wheat;
    font-weight: 500;
    margin: -15px 0 15px;
    display: flex;
    justify-content: space-between;
}
.remember-forgot label input{
    accent-color: blue;
    margin-right: 3px;
}
.remember-forgot a{
    color: pink;
    text-decoration: none;

}.remember-forgot a:hover{
    text-decoration: underline;
}
.btn{
    width: 100%;
    height: 45px;
    background: lightseagreen;
    border: none;
    outline: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    color: wheat;
    font-weight: 500;
}.login-register{
    font-size: 1em;
    color: beige;
    text-align: center;
    font-weight:500;
    margin: 25px 0 10px ;
}
.login-register p a{
    color: #fff;
    text-decoration: none;
    font-weight: 100;
    

}.login-register p a:hover{
    text-decoration: underline;
}
    </style>
</head>
