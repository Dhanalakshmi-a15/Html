<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=National+Park:wght@200..800&family=Noto+Sans+JP:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'poppins',sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: black;
        }
        .wrapper{
            position: relative;
            width: 400px;
            height: 500px;
            background:black;
            box-shadow: 0 0 50px #0ef;
            border-radius: 20px;
            padding: 40px;
    
        }
        .form-wrapper{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            transition: 1s ease-in-out;

        }
        .wrapper .active .form-wrapper .sign-in{
            transform: translateY(-450px);
        }
        h2{
        font-size: 30px;
        color: gray;
        text-align: center;
        }
        .input-group{
            position: relative;
            margin: 30px 0;
            border-bottom: 2px solid #fff;
        }
        .input-group label{
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            font-size: 16px;
            color:palevioletred;
            pointer-events: none;
            transition: .5s;

        }
        .input-group input{
            width: 320px;
            height: 40px;
            font-size: 16px;
            color: azure;
            padding: 0 5px;
            background: transparent;
            border:none;
            outline: none;
        }
        .input-group input:focus~label,
        .input-group input:valid~label{
            top: -5px;
        }
        .remember{
            margin: -5px 0 15px 5px;
        }
        .remember label{
            color: white;
            font-size: 14px;
        }
        .remember label input{
            accent-color: skyblue;
        }
        button{
            position: relative;
            width: 100%;
            height: 40px;
            background: #0ef;
            box-shadow: 0 0 10px #0ef;
            font-size: 16px;
            color: black;
            font-weight: 500;
            cursor: pointer;
            border-radius: 30px;
            border: none;
            outline: none;
        }
        button:hover{
            background: pink;
            color: blue;
        }
        .signup-link{
            font-size: 14px;
            text-align: center;
            margin: 15px 0;

        }
        .signup-link p{
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }
        .signup-link p a{
            color: #0ef;
            text-decoration: none;
            font-weight: 500;
        }
        .signup-link p a:hover{
            text-decoration: underline;
        }
        </style>
</head>
<body>
<div class="wrapper">
    <div class="form-wrapper sign-up" style="display: none;">
        <form method="post" action="/signup.php">
          <h2>Sign Up</h2>
          <div class="input-group">
              <input type="text" required>
              <label for="">Username</label>
          </div>
          <div class="input-group">
              <input type="email" required>
              <label for="">Email</label>
          </div>
          <div class="input-group">
              <input type="password" required>
              <label for="">Password</label>
          </div>
          <button type="submit">Sign Up</button>
          <div class="signup-link">
              <p>Already have an account? <a href="#" class="signinbtn-link">Login</a></p>
          </div>
        </form>
      </div>
    
</div>
<script>
   
  const wrapper = document.querySelector('.wrapper');
  const signInForm = document.querySelector('.form-wrapper.sign-in');
  const signUpForm = document.querySelector('.form-wrapper.sign-up');
  const signUpBtnLink = document.querySelector('.signupbtn-link');
  const signInBtnLink = document.querySelector('.signinbtn-link');

  signUpBtnLink.addEventListener('click', (e) => {
    e.preventDefault();
    signInForm.style.display = 'none';
    signUpForm.style.display = 'flex';
  });

  signInBtnLink.addEventListener('click', (e) => {
    e.preventDefault();
    signUpForm.style.display = 'none';
    signInForm.style.display = 'flex';
  });

</script>
</body>
</html>
