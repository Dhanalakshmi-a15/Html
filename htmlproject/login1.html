<body>
    
    <div class="form-wrapper sign-up" style="display: none;">
        <form method="post" action="">
            <h2>Sign Up</h2>
            <div class="input-group">     <input type="text" name="username" required>
                <label>Username</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" required>
                <label>Password</label>
            </div>
            <div class="remember">
                <label><input type="checkbox" required> I agree to terms</label>
            </div>
            <button type="submit">Sign Up</button>
            <div class="signup-link">
                <p>Already have an account? <a href="#" class="signinbtn-link">Login</a></p>
            </div>
        </form>
    </div>
