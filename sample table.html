    <head>
        <meta charset="UTF-8">
        <style>
            table,td,th
            {
                border:5px solid violet;
            
                border-collapse:collapse ;
            }
            td{
                text-align: center;
                font-style:initial;
                font-size:medium;
                color: blue;
            


            }
            th
            {
                color: brown;
                font-size:large;
                background-color: yellow;
            }
            td:nth-child(5n+1)
            {
                background-color: red;
                color: black;
            }
            td:nth-child(5n+2)
            {
                background-color: rgb(178, 19, 178);
                color: black;
            }
            td:nth-child(5n+4)
            {
                background-color: rgba(214, 155, 97, 0.2);
                color: black;
            }
            td:nth-child(5n+5)
            {
                background-color: brown;
                color: beige;
            }

        </style>
    </head>
