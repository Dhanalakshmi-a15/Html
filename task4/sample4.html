<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUiz App</title>
    <script>var questions=[{
        "question":"which is the program run the browser?",
        "option1":"java",
        "option2":"python",
        "option3":"c",
        "option4":"javascript",
        "answer":"4",
    },
    {
    "question":"which is the single integrsted ciecuit?",
        "option1":"java",
        "option2":"python",
        "option3":"c",
        "option1":"javascript",
    },
    {
        "question":"whih of following is the must powerful type of coumputer?",
        "option1":"super-micro",
        "option2":"super-conductor",
        "option3":"super computer",
        "option1":"megaframe",
        "answer":"3",
    }]
    var question=document.getElementById('question');
    var optoin1=document.getElementById('option1');
    var option2=document.getElementById('option2');
    var option3=document.getElementById('option3');
    var option4=document.getElementById('option4');
    var result=document.getElementById('result');
    var currentQuestion=0;
    var totalquestions=questions.length;
    function loadQuestion(index){
        var data=questions[index];
        question.textcontent=(index + 1)+'.'+data.question;
        optoin1.textcontent=data.option1;
        option2.textcontent=data.option2;
        option3.textcontent=data.option3;
        option4.textcontent=data.option4;
    };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<style>

body    {
        font-family: 'roboto',sans-serif;
        background: #f0a202;
    }
    .container{
        height: 330px;
        width: 1000px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translateX(-50%) translatey(-50%);
        background: #202c59;
        padding:20px;
        border: 1px solid #581f18;
        box-shadow: 0 0 3px #d95d39;
    }
    .title{
        font-size: 36px;
        padding-bottom: 20px;
        text-align:center;
        text-transform: uppercase;
        color: #f18805;
    }
    .question{
        font-size: 22px;
        padding: 20px;
        border-radius: 20px;
        color:red;
        
    }
    .option{
        width: 470px;
        display: inline-block;
        padding: 10px 0 10px 15px;
        vertical-align: middle;
        background:pink;
        margin: 10px 0 10px 10px;
        border-radius: 20px;
        cursor: pointer;
    }
    .option:hover{
        background: beige;
        color: #f6f6f6;
    }
    .next-btn{
          border:none;
          outline: none;
          background: #f6f6f6;
          width: 100px;
          height: 35px;
          border-radius: 20px;
          cursor: pointer;
          float: right;
          margin: 10px;
    }
    .next-btn:hover{
        background: red;
        color: white;
    }
    .result{
        height: 100px;
        font-size: 60px;
        text-align: center;
        color: aqua;
    }
</style>

</head>
<body>

    <div id="container" class="container">
    <div class="title">Computer QUiz</div>
    <div id="question" class="question">kuehfjewhfjfjhjf</div>
    <label class="option">
        <input type="radio" name="option" >
        <span id="option1"></span>
    </label>
    <label class="option">
        <input type="radio" name="option" >
        <span id="option2"></span>
    </label>
    
    <label class="option">
        <input type="radio" name="option" >
        <span id="option3"></span>
    </label>
    
    <label class="option">
        <input type="radio" name="option" >
        <span id="option4"></span>
    </label>
    <button type="button"  class="next-btn" onclick="loadNextQuestion();">Next QUetion</button>

</div>
    <div  id="result" class="container result" style="display:none;"></div>

</body>
</html>
