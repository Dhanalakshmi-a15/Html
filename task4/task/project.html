.container  {

.heading{

label{

select{

}
.btn{
    width: 100px;
    height: 60px;
    background-color: brown;
    border: none;
    border-radius: 10px;
    margin-top: 15px;
    color: rgb(0, 38, 104);
    font-size: 18px;
    font-weight: 200;
    cursor: pointer;
    transition: all 0.3s linear;
}
.btn:hover{
    
    background-color: blue;
    
}
.btn:disabled{
    cursor: not-allowed;
    background-color: blueviolet;
}
.start-screen-hide{
    display:none;
}
.timer{
    width: 100%;
    height:100px;
    display: flex;
    align-items: center;
    justify-content: center;
margin-bottom: 30px;

}
.timer.progress{
    position: relative;
    width: 100%;
    height: 60px;
    background-color: transparent;
    border-radius: 30px;
    overflow:hidden;
    margin-bottom: 10px;
    border:3px solid red;


}
.timer.progress.progress-bar{
    width: 100%;
    height:100%;
    border-radius: 30px;
    overflow: hidden;
    background:linear-gradient(to right,pink,lightpink) ;
    transition: 1s linear;

}
.timer.progress.progress-text{
    position: absolute;
    top: 50px;
    left: 50px;
    transform: translate(50%,50%);
    color: chartreuse;
    font-size:16px;
    font-weight: 500;
}
.question-wrapper.number{

}
