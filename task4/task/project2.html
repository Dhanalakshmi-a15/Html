

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Montserrat", sans-serif;
}

body {
    display: flex;
    padding: 15px;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: blueviolet;
}

.config-container {
    width: 415px;
    padding: 25px;
    text-align: center;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.13);
}

.config-title {
    font-size: 1.31rem;
    margin-bottom: 20px;
}

.config-option {
    margin-top: 25px;
}

.option-title {
    font-size: 1.125rem;
    font-weight: 500;
    margin-bottom: 20px;
}

.category-options {
    display: grid;
    gap: 15px;
    grid-template-columns: repeat(2, 1fr);
}

.category-option {
    padding: 12px;
    font-size: 0.938rem;
    font-weight: 500;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid #9bbfff;
}

.questions-options {
    grid-template-columns: repeat(5, 1fr);
}

.start-quiz-btn {
    padding: 12px;
    font-size: 0.938rem;
    font-weight: 500;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid #9bbfff;
    margin-top: 25px;
}

    </style>
</head>
<body>
    <div class="config-container">
        <h2 class="config-title">Quiz Configuration</h2>
        <div class="config-option">
            <h4 class="option-title">Select Category</h4>
            <div class="category-options">
                <button class="category-option">Programming</button>
                <button class="category-option">Geography</button>
                <button class="category-option">Mathematics</button>
                <button class="category-option">Entertainment</button>
            </div>
        </div>
        <div class="config-option">
            <h4 class="option-title">No. of Questions</h4>
            <div class="category-options questions-options">
                <button class="category-option">5</button>
                <button class="category-option">10</button>
                <button class="category-option">15</button>
                <button class="category-option">20</button>
                <button class="category-option">25</button>
            </div>
        </div>
        <button class="start-quiz-btn">Start Quiz</button>
    </div>
</body>
</html>
