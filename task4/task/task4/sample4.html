<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<style>
body    {
        font-family: 'roboto',sans-serif;
        background: #f0a202;
    }
    .container{
        height: 330px;
        width: 1000px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translateX(-50%) translatey(-50%);
        background: #202c59;
        padding:20px;
        border: 1px solid #581f18;
        box-shadow: 0 0 3px #d95d39;
    }
    .title{
        font-size: 36px;
        padding-bottom: 20px;
        text-align:center;
        text-transform: uppercase;
        color: #f18805;
    }
    .question{
        font-size: 22px;
        padding: 20px;
        border-radius: 20px;
        color:white;
        background:  #f18805;
    }
</style>

</head>
<body>

    <div id="container" class="container">
    <div class="title">Computer QUiz</div>
    <div id="question" class="question">what is your name</div>
    <label>
        <input type="radio" name="option" class="option">
        <span id="option1">Options1</span>
    </label>
    <label>
        <input type="radio" name="option" class="option">
        <span id="option2">Options2</span>
    </label>
    
    <label>
        <input type="radio" name="option" class="option">
        <span id="option3">Options3</span>
    </label>
    
    <label>
        <input type="radio" name="option" class="option">
        <span id="option4">Options4</span>
    </label>
    <button type="button" onclick="loadNextQuestion();">Next QUetion</button>

</div>
    <div class="container result" style="display:none;"></div>
</body>
</html>
