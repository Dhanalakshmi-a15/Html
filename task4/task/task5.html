<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ APP</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            background-color: aqua;
            background-image: linear-gradient(315deg,red 0%,blue 100%);
            font-family: 'poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            margin:0;

        }
        .quiz-container{
            background-color: blueviolet;
            border-radius: 10px;
            box-shadow: 0 0 10px 2px rgba(0,0,0,0.13);
            width: 600px;
            overflow: hidden;
            margin: 0;

        }
        .quiz-header{
            padding: 4rem;
        }
        h2{
            padding: 1rem;
            text-align: center;
            margin: 0;
        }
        ul{
            list-style-type:none;
            padding:0;

        }
         ul li{
            font-size: 1.2rem;
            margin: 1rem 0;
        }
        
ul li label{
    cursor: pointer;

}
button{
    background-color: aqua;
    color: blueviolet;
    border: none;
    display: block;
    width: 100%;
    cursor: pointer;
    font-size: 1.1rem;
    font-family: inherit;
    padding: 1.3rem;
}
button:hover{
    background-color: brown;
}

    </style>
</head>
<body>
     <div class="quiz-container">
        <div class="quiz-header">
            <h2 id="question">Quetions Text</h2>
            <ul>
                <li>
                    <input type="radio" name="answer" id="a" class="answer">
                    <label for="a" id="a-text">ANSWER</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="b" class="answer">
                    <label for="b" id="b-text">ANSWER</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="c" class="answer">
                    <label for="c" id="c-text">ANSWER</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="d" class="answer">
                    <label for="d" id="d-text">ANSWER</label>
                </li>
     
     
     
            </ul>
        </div>
        <button id="submit">SUbmit</button>
     </div>
     <script src="script.js"></script>
    
</body>
</html>
